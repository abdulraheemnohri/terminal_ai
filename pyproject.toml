[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "models",
  ".terminal_ai",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = [
  "agent",
  "routers",
]
omit = [
  "tests/*",
]
