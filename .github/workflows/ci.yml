name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Keep a hard upper bound while allowing the full suite to finish.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate project structure
        run: python scripts/check_structure.py

      - name: Compile application modules
        run: |
          python -m compileall -q app.py terminal_ai.py litert_api_backend.py api_provider_backend.py application agent routers scripts api_schemas.py command_control.py selfx_engine.py workspace_tools.py task_scheduler.py

      - name: Validate POSIX startup/update scripts
        run: |
          for script in ./*.sh scripts/*.sh termux-boot/*.sh; do [ -f "$script" ] || continue; sh -n "$script"; done

      - name: Validate dashboard JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/chat-enhancements.js
          sh -n scripts/validate.sh

      - name: Run test suite
        # Fail fast so the workflow captures a useful traceback instead of continuing into a stalled test.
        # Dump thread stacks when a single test stalls for two minutes.
        run: python -m pytest tests/ -v --color=yes -x -o faulthandler_timeout=120
