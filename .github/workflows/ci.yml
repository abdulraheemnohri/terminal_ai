name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile application modules
        run: |
          python -m compileall -q app.py terminal_ai.py litert_api_backend.py api_provider_backend.py agent routers api_schemas.py command_control.py selfx_engine.py workspace_tools.py task_scheduler.py

      - name: Validate POSIX startup/update scripts\n        run: |\n          sh -n install.sh scripts/install-service.sh scripts/update.sh scripts/termux-boot-start.sh\n\n      - name: Run test suite
        run: python -m pytest tests/ -v --color=yes
